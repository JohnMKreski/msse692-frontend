# apprunner.yaml
version: 1.0
runtime: nodejs18  

build:
  commands:
    pre-build:
      - npm ci
    build:
      - npm run build

run:
  # runtime-version: 18.20.0

  # this is what you already run locally:
  command: node dist/msse692-frontend/server/server.mjs

  network:
    port: 4000      

  env:
    - name: NODE_ENV
      value: production
